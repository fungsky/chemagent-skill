name: Feature Request / 功能建议
description: Suggest a new capability for the skill — new API endpoints, knowledge cards, platform support, etc. 建议新增能力：API、知识卡片、平台支持等。
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! 感谢建议。请说明你想解决的问题与期望方案。
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: What are you trying to do and why? 你想做什么、为什么？
      placeholder: "I want the assistant to check EU cosmetics regulation..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution / 期望方案
      description: How should it work? 你希望它如何工作？
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area / 涉及模块
      options:
        - Client (chemagent_client.py)
        - Knowledge cards / 知识卡片
        - SKILL.md prompts / 技能指令
        - Platform packaging / 平台打包
        - Documentation / 文档
        - Other
  - type: checkboxes
    id: willingness
    attributes:
      label: Contribution / 参与意愿
      description: Would you like to help implement it? 是否愿意协助实现？
      options:
        - label: "Yes, I can submit a PR / 可以，我来提 PR"
